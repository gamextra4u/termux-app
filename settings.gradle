pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    plugins {
        id "com.google.protobuf" version "0.9.4"
        id "org.jetbrains.kotlin.android" version "1.9.22"
        id "com.android.application" version "8.2.1"
    }
}

include ':app', ':termux-shared', ':terminal-emulator', ':terminal-view'
include ':shell-loader'
include ':shell-loader:stub'
include ':termux-x11'
include ':float-ball'
include ':termux-gui'
include ':hbuffers'
project(':termux-gui').projectDir = new File('termux-gui/app')
project(':hbuffers').projectDir = new File('termux-gui/hbuffers')

